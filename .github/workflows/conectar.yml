name: Conectar uma rede
on:
  workflow_dispatch:
    inputs:
      rede:
        description: "Qual rede"
        type: choice
        options: [instagram, youtube, tiktok]
      codigo:
        description: "Código que apareceu na página Conectar"
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  conectar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Trocar o código pelo acesso
        run: python robo/conectar.py "$REDE" "$CODIGO"
        env:
          COFRE_CHAVE: ${{ secrets.COFRE_CHAVE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDE: ${{ inputs.rede }}
          CODIGO: ${{ inputs.codigo }}
      - name: Guardar mudanças
        run: |
          git config user.name "robo-nino"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A agenda dados robo
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Robô: rede conectada"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

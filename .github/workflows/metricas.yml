name: Métricas do dia
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Puxar métricas
        run: python robo/metricas.py
        env:
          COFRE_CHAVE: ${{ secrets.COFRE_CHAVE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar mudanças
        run: |
          git config user.name "robo-nino"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A agenda dados robo
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Robô: métricas do dia"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
